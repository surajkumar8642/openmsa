name: Bug report
description: File a bug in OpenMSA
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and reproduction steps.
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      description: API endpoint or code path
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
